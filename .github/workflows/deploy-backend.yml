name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach \
            --service 906bb9d4-483a-47aa-a42c-59443af064e8 \
            --environment fd41563e-2173-42ef-aa57-579e5a9294b1

      - name: Record deployed commit on service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables --set "GIT_COMMIT=${{ github.sha }}" \
            --service 906bb9d4-483a-47aa-a42c-59443af064e8 \
            --environment fd41563e-2173-42ef-aa57-579e5a9294b1
