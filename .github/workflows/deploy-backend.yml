name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: 906bb9d4-483a-47aa-a42c-59443af064e8
      RAILWAY_ENVIRONMENT_ID: fd41563e-2173-42ef-aa57-579e5a9294b1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          railway up --ci --detach \
            --service="$RAILWAY_SERVICE_ID" \
            --environment="$RAILWAY_ENVIRONMENT_ID"

      - name: Record deployed commit on service
        run: |
          railway variables --set "GIT_COMMIT=${{ github.sha }}" \
            --service="$RAILWAY_SERVICE_ID" \
            --environment="$RAILWAY_ENVIRONMENT_ID"
